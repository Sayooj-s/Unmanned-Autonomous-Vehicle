<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — UAV Ground Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <span class="brand-text">UAV GROUND CONTROL</span>
    </div>
  </header>

  <main class="auth-wrap">
    <form class="auth-card" id="loginForm">
      <h1>Sign in</h1>
      <p class="auth-sub">Access the fleet dashboard.</p>

      <label class="auth-label" for="email">Email</label>
      <input class="auth-input" type="email" id="email" required autocomplete="email" />

      <label class="auth-label" for="password">Password</label>
      <input class="auth-input" type="password" id="password" required autocomplete="current-password" />

      <div class="auth-error" id="authError" style="display:none;"></div>

      <button class="auth-submit" type="submit" id="submitBtn">Sign in</button>

      <p class="auth-switch">No account? <a href="signup.html">Create one</a></p>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    // If already logged in, skip straight past this page.
    (async function redirectIfLoggedIn() {
      const token = getAuthToken();
      if (!token) return;
      try {
        const res = await fetch((window.API_BASE || "") + "/api/auth/me", { headers: authHeaders() });
        if (res.ok) window.location.href = nextPageOrDefault();
      } catch (e) { /* stay on the login page */ }
    })();

    function nextPageOrDefault() {
      const params = new URLSearchParams(window.location.search);
      return params.get("next") || "index.html";
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("authError");
      const submitBtn = document.getElementById("submitBtn");
      errorEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      try {
        const res = await fetch((window.API_BASE || "") + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.detail || "Sign in failed");

        setAuthToken(body.access_token);
        window.location.href = nextPageOrDefault();
      } catch (err) {
        errorEl.textContent = err.message || "Something went wrong";
        errorEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign in";
      }
    });
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UAV Live Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="map.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a href="index.html#modules" class="back-link">← Home</a>
    <span class="brand-sep">/</span>
    <span class="brand-mark">◎</span>
    <span class="brand-text">LIVE MAP</span>
  </div>
  <div class="link-status" id="linkStatus">
    <span class="pulse-dot" id="pulseDot"></span>
    <span id="linkLabel">CONNECTING…</span>
  </div>
</header>

<div id="map"></div>

<div class="fleet-overlay" id="fleetOverlay">
  <div class="fleet-overlay-header">TRACKED UAVs</div>
  <div id="fleetOverlayList"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="map.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UAV Commanding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="command.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a href="index.html#modules" class="back-link">← Home</a>
    <span class="brand-sep">/</span>
    <span class="brand-mark">▶</span>
    <span class="brand-text">COMMANDING</span>
  </div>
  <div class="link-status" id="linkStatus">
    <span class="pulse-dot" id="pulseDot"></span>
    <span id="linkLabel">CONNECTING…</span>
  </div>
</header>

<div class="cmd-layout">

  <aside class="cmd-panel">

    <div class="field-group">
      <label class="field-label" for="uavSelect">UAV</label>
      <select id="uavSelect" class="field-select">
        <option value="">Select a UAV…</option>
      </select>
    </div>

    <div class="cmd-empty" id="cmdEmpty">
      Select a UAV to see its status and send a command.
    </div>

    <div class="cmd-content" id="cmdContent" style="display:none;">

      <div class="battery-readout">
        <div class="battery-readout-label">Current Battery</div>
        <div class="battery-readout-value">
          <span id="battVal">—</span><span class="battery-unit">%</span>
        </div>
        <div class="battery-bar"><div class="battery-bar-fill" id="battBar"></div></div>
        <div class="battery-readout-sub" id="battUpdated">no data yet</div>
      </div>

      <div class="current-status">
        <div class="status-row">
          <span class="status-key">Pending command</span>
          <span class="status-val" id="currentCmd">NONE</span>
        </div>
        <div class="status-row" id="currentDestRow" style="display:none;">
          <span class="status-key">Destination</span>
          <span class="status-val" id="currentDest">—</span>
        </div>
      </div>

      <form class="cmd-form" id="cmdForm">
        <div class="field-group">
          <label class="field-label" for="commandSelect">Command</label>
          <select id="commandSelect" class="field-select">
            <option value="GOTO">GOTO — fly to destination</option>
            <option value="RTL">RTL — return to launch</option>
            <option value="HOLD">HOLD — loiter in place</option>
            <option value="NONE">CLEAR — cancel pending command</option>
          </select>
        </div>

        <div class="field-row" id="latlonFields">
          <div class="field-group">
            <label class="field-label" for="latInput">Destination latitude</label>
            <input class="field-input" type="number" step="0.000001" min="-90" max="90" id="latInput" placeholder="e.g. 8.524139" />
          </div>
          <div class="field-group">
            <label class="field-label" for="lonInput">Destination longitude</label>
            <input class="field-input" type="number" step="0.000001" min="-180" max="180" id="lonInput" placeholder="e.g. 76.936638" />
          </div>
        </div>

        <div class="field-hint" id="mapHint">Click the map to set the destination, or type coordinates directly.</div>

        <button type="submit" class="btn-send" id="sendBtn">Send Command</button>
      </form>

    </div>

  </aside>

  <main class="cmd-map-wrap">
    <div id="cmdMap"></div>
    <div class="map-layer-hint" id="mapLayerHint">Click anywhere on the map to set a GOTO destination.</div>
  </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="command.js"></script>
</body>
</html>
